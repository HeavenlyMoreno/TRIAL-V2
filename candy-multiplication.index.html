<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Candy Multiplication</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@500;700;800&family=Nunito:wght@400;600;700;800&display=swap" rel="stylesheet">
<script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
<script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
<script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
<style>
  * { box-sizing: border-box; }
  body { margin: 0; font-family: 'Nunito', sans-serif; }
  .display-font { font-family: 'Baloo 2', 'Nunito', sans-serif; }
  @keyframes bounceKF { 0%,100% { transform: translateY(0) rotate(-2deg);} 50% { transform: translateY(-10px) rotate(2deg);} }
  @keyframes nodKF { 0%,100% { transform: rotate(0deg);} 50% { transform: rotate(-4deg);} }
  @keyframes popIn { 0% { transform: scale(0.6); opacity:0;} 60% {transform: scale(1.08);} 100% {transform: scale(1); opacity:1;} }
  @keyframes shake { 0%,100% { transform: translateX(0);} 20% {transform: translateX(-6px);} 40% {transform: translateX(6px);} 60% {transform: translateX(-4px);} 80% {transform: translateX(4px);} }
  @keyframes countdownKF { from { stroke-dashoffset: 0; } to { stroke-dashoffset: 226; } }
  .mascot-bounce { animation: bounceKF 0.6s ease-in-out infinite; transform-origin: center; }
  .mascot-nod { animation: nodKF 0.5s ease-in-out 2; transform-origin: bottom center; }
  .pop-in { animation: popIn 0.35s cubic-bezier(.34,1.56,.64,1); }
  .shake { animation: shake 0.45s ease; }
  .choice-btn { transition: transform 0.12s ease, box-shadow 0.12s ease; }
  .choice-btn:hover:not(:disabled) { transform: translateY(-2px); }
  .choice-btn:active:not(:disabled) { transform: translateY(1px) scale(0.98); }
  .table-chip { transition: transform 0.12s ease, background 0.15s ease, color 0.15s ease; position: relative; }
  .table-chip:hover { transform: translateY(-2px); }
  .icon-btn { border: none; background: #ffffff; width: 40px; height: 40px; border-radius: 12px; display: flex; align-items: center; justify-content: center; cursor: pointer; box-shadow: 0 3px 0 #E4DACB; flex-shrink: 0; }
  .icon-btn:active { transform: translateY(1px); }
</style>
</head>
<body>
<div id="root"></div>

<script type="text/babel" data-presets="react">
const { useState, useEffect, useRef } = React;

// ---------- inline icons (no external icon library needed) ----------
const Icon = ({ children, size = 20, ...rest }) => (
  <svg width={size} height={size} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" {...rest}>
    {children}
  </svg>
);
const StarIcon = (p) => <Icon {...p}><polygon points="12 2 15.09 8.26 22 9.27 17 14.14 18.18 21.02 12 17.77 5.82 21.02 7 14.14 2 9.27 8.91 8.26 12 2" /></Icon>;
const TrophyIcon = (p) => <Icon {...p}><path d="M8 21h8M12 17v4M7 4h10v5a5 5 0 0 1-10 0V4zM7 4H3v2a4 4 0 0 0 4 4M17 4h4v2a4 4 0 0 1-4 4"/></Icon>;
const HomeIcon = (p) => <Icon {...p}><path d="M3 9l9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V9z"/><polyline points="9 22 9 12 15 12 15 22"/></Icon>;
const SparklesIcon = (p) => <Icon {...p}><path d="M12 2l1.5 5.5L19 9l-5.5 1.5L12 16l-1.5-5.5L5 9l5.5-1.5L12 2z"/></Icon>;
const ChevronRightIcon = (p) => <Icon {...p}><polyline points="9 18 15 12 9 6"/></Icon>;
const RotateCcwIcon = (p) => <Icon {...p}><polyline points="1 4 1 10 7 10"/><path d="M3.51 15a9 9 0 1 0 2.13-9.36L1 10"/></Icon>;
const Volume2Icon = (p) => <Icon {...p}><polygon points="11 5 6 9 2 9 2 15 6 15 11 19 11 5"/><path d="M19.07 4.93a10 10 0 0 1 0 14.14M15.54 8.46a5 5 0 0 1 0 7.07"/></Icon>;
const VolumeXIcon = (p) => <Icon {...p}><polygon points="11 5 6 9 2 9 2 15 6 15 11 19 11 5"/><line x1="23" y1="9" x2="17" y2="15"/><line x1="17" y1="9" x2="23" y2="15"/></Icon>;
const ZapIcon = (p) => <Icon {...p}><polygon points="13 2 3 14 12 14 11 22 21 10 12 10 13 2"/></Icon>;
const AwardIcon = (p) => <Icon {...p}><circle cx="12" cy="8" r="6"/><path d="M15.5 13.5L17 22l-5-3-5 3 1.5-8.5"/></Icon>;

const CANDY_COLORS = [
  { fill: "#FF6B9D", dark: "#C4467A" },
  { fill: "#FFC93C", dark: "#E0A415" },
  { fill: "#4ECDC4", dark: "#2A9D95" },
  { fill: "#8B5FBF", dark: "#6A429B" },
  { fill: "#FF8C42", dark: "#DB6A1F" },
  { fill: "#5FA8D3", dark: "#3B82B8" },
];

const TABLES = Array.from({ length: 12 }, (_, i) => i + 1);
const ROUND_LENGTH = 10;
const TIME_LIMIT_MS = 10000;
const FAST_THRESHOLD_MS = 4000;
const TIMEOUT = "__TIMEOUT__";

// ---------- sound ----------
let audioCtx = null;
function getCtx() {
  const AC = window.AudioContext || window.webkitAudioContext;
  if (!AC) return null;
  if (!audioCtx) audioCtx = new AC();
  if (audioCtx.state === "suspended") audioCtx.resume();
  return audioCtx;
}
function tone(freq, startTime, duration, type = "sine", peak = 0.14) {
  try {
    const ctx = getCtx();
    if (!ctx) return;
    const osc = ctx.createOscillator();
    const gain = ctx.createGain();
    osc.type = type;
    osc.frequency.value = freq;
    const t0 = ctx.currentTime + startTime;
    gain.gain.setValueAtTime(0, t0);
    gain.gain.linearRampToValueAtTime(peak, t0 + 0.02);
    gain.gain.exponentialRampToValueAtTime(0.001, t0 + duration);
    osc.connect(gain).connect(ctx.destination);
    osc.start(t0);
    osc.stop(t0 + duration + 0.05);
  } catch (e) {}
}
const sound = {
  correct: () => { tone(523.25, 0, 0.12, "sine", 0.13); tone(659.25, 0.09, 0.18, "sine", 0.15); },
  wrong: () => tone(180, 0, 0.28, "sawtooth", 0.07),
  timeout: () => tone(140, 0, 0.3, "triangle", 0.08),
  tap: () => tone(700, 0, 0.05, "sine", 0.05),
  fanfare: (stars) => {
    const notes = [523.25, 659.25, 784.0, 1046.5];
    for (let i = 0; i <= stars; i++) tone(notes[i] || notes[notes.length - 1], i * 0.13, 0.22, "sine", 0.13);
  },
};

// ---------- storage (plain localStorage since this runs as a normal web page) ----------
function defaultProgress() {
  return { tables: {}, totalStars: 0, roundsPlayed: 0, bestStreakEver: 0 };
}
function loadProgress() {
  try {
    const raw = localStorage.getItem("candy-mult-progress");
    return raw ? JSON.parse(raw) : defaultProgress();
  } catch (e) { return defaultProgress(); }
}
function saveProgress(progress) {
  try { localStorage.setItem("candy-mult-progress", JSON.stringify(progress)); } catch (e) {}
}
function loadSettings() {
  try {
    const raw = localStorage.getItem("candy-mult-settings");
    if (raw) return JSON.parse(raw);
  } catch (e) {}
  return { sound: true, speedMode: false, selectedTables: [2, 3, 4, 5] };
}
function saveSettings(settings) {
  try { localStorage.setItem("candy-mult-settings", JSON.stringify(settings)); } catch (e) {}
}

// ---------- helpers ----------
function pickCandyColor(a) { return CANDY_COLORS[(a - 1) % CANDY_COLORS.length]; }
function makeQuestion(tables) {
  const a = tables[Math.floor(Math.random() * tables.length)];
  const b = Math.floor(Math.random() * 10) + 1;
  return { a, b, answer: a * b, key: `${a}x${b}-${Math.random()}` };
}
function makeChoices(a, b) {
  const correct = a * b;
  const pool = new Set([correct]);
  const candidates = [
    (a - 1) * b, (a + 1) * b, a * (b - 1), a * (b + 1),
    correct + a, correct - a, correct + b, correct - b, a + b,
    correct + (Math.random() < 0.5 ? 1 : -1) * (Math.floor(Math.random() * 4) + 1),
  ].filter((n) => n > 0 && n !== correct);
  const shuffled = candidates.sort(() => Math.random() - 0.5);
  for (const c of shuffled) { if (pool.size >= 4) break; pool.add(c); }
  let filler = correct + 2;
  while (pool.size < 4) { if (filler > 0 && !pool.has(filler)) pool.add(filler); filler += 3; }
  return Array.from(pool).sort(() => Math.random() - 0.5);
}
function ratingForAccuracy(correct, total) {
  const pct = correct / total;
  if (pct >= 0.9) return { stars: 3, msg: "Sweet victory! You're a multiplication master!" };
  if (pct >= 0.7) return { stars: 2, msg: "Great job! You're getting stronger every round." };
  if (pct >= 0.4) return { stars: 1, msg: "Nice try! A little more practice and you'll shine." };
  return { stars: 0, msg: "Every expert started somewhere. Let's practice again!" };
}
function masteryLevel(tp) {
  if (!tp || tp.attempts < 4) return "new";
  const acc = tp.correct / tp.attempts;
  if (tp.attempts >= 8 && acc >= 0.85) return "mastered";
  if (acc >= 0.5) return "practicing";
  return "new";
}

function CandyGrid({ a, b, color, popped }) {
  const cells = [];
  for (let r = 0; r < a; r++) for (let c = 0; c < b; c++) cells.push({ idx: r * b + c });
  const size = a * b > 40 ? 16 : a * b > 24 ? 20 : 26;
  return (
    <div style={{ display: "grid", gridTemplateColumns: `repeat(${b}, ${size}px)`, gap: size < 20 ? 4 : 6, justifyContent: "center", margin: "0 auto", maxWidth: "100%" }}>
      {cells.map((cell) => (
        <div key={cell.idx} style={{
          width: size, height: size, borderRadius: "50%",
          background: `radial-gradient(circle at 32% 28%, ${color.fill}ee, ${color.dark})`,
          boxShadow: "inset 0 -2px 3px rgba(0,0,0,0.15), 0 1px 2px rgba(0,0,0,0.15)",
          opacity: popped ? 1 : 0,
          transform: popped ? "scale(1)" : "scale(0.3)",
          transition: `opacity 0.28s ease ${cell.idx * 12}ms, transform 0.28s cubic-bezier(.34,1.56,.64,1) ${cell.idx * 12}ms`,
        }} />
      ))}
    </div>
  );
}

function Mascot({ mood, size = 64 }) {
  const bounce = mood === "excited" ? "mascot-bounce" : mood === "happy" ? "mascot-nod" : "";
  const eyes = mood === "sad" ? (
    <>
      <path d="M24 30 Q28 34 32 30" stroke="#3D2645" strokeWidth="3" fill="none" strokeLinecap="round" />
      <path d="M42 30 Q46 34 50 30" stroke="#3D2645" strokeWidth="3" fill="none" strokeLinecap="round" />
    </>
  ) : (
    <>
      <circle cx="28" cy="30" r="4" fill="#3D2645" />
      <circle cx="46" cy="30" r="4" fill="#3D2645" />
    </>
  );
  const mouth = mood === "sad" ? (
    <path d="M28 46 Q37 40 46 46" stroke="#3D2645" strokeWidth="3" fill="none" strokeLinecap="round" />
  ) : (
    <path d="M26 42 Q37 54 48 42" stroke="#3D2645" strokeWidth="3" fill="none" strokeLinecap="round" />
  );
  return (
    <svg width={size} height={size} viewBox="0 0 74 74" className={bounce}>
      <circle cx="37" cy="37" r="34" fill="#FF6B9D" stroke="#C4467A" strokeWidth="2" />
      <circle cx="37" cy="37" r="34" fill="url(#shine)" opacity="0.5" />
      <defs>
        <radialGradient id="shine" cx="35%" cy="30%" r="60%">
          <stop offset="0%" stopColor="#fff" stopOpacity="0.55" />
          <stop offset="100%" stopColor="#fff" stopOpacity="0" />
        </radialGradient>
      </defs>
      {eyes}
      {mouth}
      <circle cx="20" cy="42" r="4.5" fill="#ffffff" opacity="0.35" />
      <circle cx="54" cy="42" r="4.5" fill="#ffffff" opacity="0.35" />
    </svg>
  );
}

function TimerRing({ timeLimitMs, questionKey, size = 40 }) {
  const r = size / 2 - 4;
  const circumference = 2 * Math.PI * r;
  return (
    <svg width={size} height={size} viewBox={`0 0 ${size} ${size}`} style={{ transform: "rotate(-90deg)", flexShrink: 0 }}>
      <circle cx={size / 2} cy={size / 2} r={r} fill="none" stroke="#EFE5D6" strokeWidth="4" />
      <circle key={questionKey} cx={size / 2} cy={size / 2} r={r} fill="none" stroke="#4ECDC4" strokeWidth="4"
        strokeLinecap="round" strokeDasharray={circumference}
        style={{ animation: `countdownKF ${timeLimitMs}ms linear forwards` }} strokeDashoffset={0} />
    </svg>
  );
}

function App() {
  const [phase, setPhase] = useState("home");
  const [selectedTables, setSelectedTables] = useState([2, 3, 4, 5]);
  const [speedMode, setSpeedMode] = useState(false);
  const [muted, setMuted] = useState(false);
  const [progress, setProgress] = useState(defaultProgress());
  const [resetArmed, setResetArmed] = useState(false);

  const [round, setRound] = useState([]);
  const [qIndex, setQIndex] = useState(0);
  const [question, setQuestion] = useState(null);
  const [choices, setChoices] = useState([]);
  const [selected, setSelected] = useState(null);
  const [correctCount, setCorrectCount] = useState(0);
  const [streak, setStreak] = useState(0);
  const [bestStreak, setBestStreak] = useState(0);
  const [fastCount, setFastCount] = useState(0);
  const [popped, setPopped] = useState(false);
  const [feedback, setFeedback] = useState(null);
  const [mascotMood, setMascotMood] = useState("idle");

  const advanceTimer = useRef(null);
  const timeoutTimer = useRef(null);
  const questionStart = useRef(0);
  const roundResults = useRef([]);

  useEffect(() => {
    const settings = loadSettings();
    setProgress(loadProgress());
    setSelectedTables(settings.selectedTables || [2, 3, 4, 5]);
    setSpeedMode(!!settings.speedMode);
    setMuted(settings.sound === false);
    return () => { clearTimeout(advanceTimer.current); clearTimeout(timeoutTimer.current); };
  }, []);

  const toggleTable = (n) => {
    if (!muted) sound.tap();
    setSelectedTables((prev) => {
      const next = prev.includes(n) ? prev.filter((x) => x !== n) : [...prev, n].sort((a, b) => a - b);
      saveSettings({ selectedTables: next, speedMode, sound: !muted });
      return next;
    });
  };

  const toggleSpeedMode = () => {
    if (!muted) sound.tap();
    setSpeedMode((prev) => { saveSettings({ selectedTables, speedMode: !prev, sound: !muted }); return !prev; });
  };

  const toggleMute = () => {
    setMuted((prev) => {
      const next = !prev;
      saveSettings({ selectedTables, speedMode, sound: !next });
      if (!next) sound.tap();
      return next;
    });
  };

  const startGame = () => {
    const tables = selectedTables.length ? selectedTables : [2, 3, 4, 5];
    const questions = Array.from({ length: ROUND_LENGTH }, () => makeQuestion(tables));
    roundResults.current = [];
    setRound(questions);
    setQIndex(0);
    setCorrectCount(0);
    setStreak(0);
    setBestStreak(0);
    setFastCount(0);
    setPhase("play");
    loadQuestion(questions[0]);
  };

  const loadQuestion = (q) => {
    clearTimeout(timeoutTimer.current);
    setQuestion(q);
    setChoices(makeChoices(q.a, q.b));
    setSelected(null);
    setFeedback(null);
    setMascotMood("idle");
    setPopped(false);
    questionStart.current = Date.now();
    requestAnimationFrame(() => requestAnimationFrame(() => setPopped(true)));
    if (speedMode) timeoutTimer.current = setTimeout(() => handleAnswer(TIMEOUT, q), TIME_LIMIT_MS);
  };

  const handleAnswer = (val, qOverride) => {
    const q = qOverride || question;
    if (selected !== null) return;
    clearTimeout(timeoutTimer.current);
    setSelected(val);
    const elapsed = Date.now() - questionStart.current;
    const isTimeout = val === TIMEOUT;
    const isCorrect = !isTimeout && val === q.answer;
    const isFast = isCorrect && elapsed < FAST_THRESHOLD_MS;

    roundResults.current.push({ a: q.a, correct: isCorrect });

    if (isTimeout) {
      if (!muted) sound.timeout();
      setFeedback("timeout"); setMascotMood("sad"); setStreak(0);
    } else if (isCorrect) {
      if (!muted) sound.correct();
      setFeedback("correct"); setMascotMood("excited");
      setCorrectCount((c) => c + 1);
      if (isFast) setFastCount((f) => f + 1);
      setStreak((s) => { const next = s + 1; setBestStreak((b) => Math.max(b, next)); return next; });
    } else {
      if (!muted) sound.wrong();
      setFeedback("wrong"); setMascotMood("sad"); setStreak(0);
    }

    advanceTimer.current = setTimeout(() => {
      const next = qIndex + 1;
      if (next < round.length) { setQIndex(next); loadQuestion(round[next]); }
      else finishRound();
    }, isCorrect ? 1100 : 1900);
  };

  const finishRound = () => {
    const results = roundResults.current;
    const finalCorrect = results.filter((r) => r.correct).length;
    const { stars } = ratingForAccuracy(finalCorrect, ROUND_LENGTH);
    if (!muted) sound.fanfare(stars);

    setProgress((prev) => {
      const next = {
        tables: { ...prev.tables },
        totalStars: prev.totalStars + stars,
        roundsPlayed: prev.roundsPlayed + 1,
        bestStreakEver: Math.max(prev.bestStreakEver, bestStreak),
      };
      results.forEach((r) => {
        const key = String(r.a);
        const tp = next.tables[key] || { attempts: 0, correct: 0 };
        next.tables[key] = { attempts: tp.attempts + 1, correct: tp.correct + (r.correct ? 1 : 0) };
      });
      saveProgress(next);
      return next;
    });

    setPhase("results");
  };

  const color = question ? pickCandyColor(question.a) : CANDY_COLORS[0];

  return (
    <div style={{
      minHeight: "100vh", fontFamily: "'Nunito', sans-serif",
      background: "radial-gradient(circle at 15% 10%, #FFF3D6 0%, transparent 45%), radial-gradient(circle at 85% 90%, #FFE1EC 0%, transparent 45%), #FFFAF2",
      padding: "24px 16px 48px", boxSizing: "border-box",
    }}>
      <div style={{ maxWidth: 560, margin: "0 auto" }}>
        {phase === "home" && (
          <HomeScreen
            selectedTables={selectedTables} toggleTable={toggleTable} onStart={startGame}
            speedMode={speedMode} toggleSpeedMode={toggleSpeedMode}
            muted={muted} toggleMute={toggleMute}
            progress={progress} resetArmed={resetArmed}
            onResetTap={() => {
              if (resetArmed) {
                const fresh = defaultProgress();
                setProgress(fresh); saveProgress(fresh); setResetArmed(false);
              } else {
                setResetArmed(true);
                setTimeout(() => setResetArmed(false), 3000);
              }
            }}
          />
        )}
        {phase === "play" && question && (
          <PlayScreen
            qIndex={qIndex} total={ROUND_LENGTH} question={question} choices={choices}
            selected={selected} feedback={feedback} color={color} popped={popped}
            streak={streak} correctCount={correctCount} mascotMood={mascotMood} speedMode={speedMode}
            onAnswer={handleAnswer} onQuit={() => setPhase("home")}
          />
        )}
        {phase === "results" && (
          <ResultsScreen
            correctCount={correctCount} total={ROUND_LENGTH} bestStreak={bestStreak}
            fastCount={fastCount} speedMode={speedMode}
            onReplay={startGame} onHome={() => setPhase("home")}
          />
        )}
      </div>
    </div>
  );
}

function HomeScreen({ selectedTables, toggleTable, onStart, speedMode, toggleSpeedMode, muted, toggleMute, progress, resetArmed, onResetTap }) {
  return (
    <div className="pop-in" style={{ textAlign: "center" }}>
      <div style={{ display: "flex", justifyContent: "flex-end", marginBottom: -36 }}>
        <button className="icon-btn" onClick={toggleMute} aria-label={muted ? "Turn sound on" : "Turn sound off"} style={{ color: "#8B5FBF" }}>
          {muted ? <VolumeXIcon size={18} /> : <Volume2Icon size={18} />}
        </button>
      </div>
      <div style={{ display: "flex", justifyContent: "center", marginBottom: 8 }}>
        <Mascot mood="excited" size={90} />
      </div>
      <h1 className="display-font" style={{ fontSize: 34, fontWeight: 800, color: "#3D2645", margin: "4px 0 2px" }}>Candy Multiplication</h1>
      <p style={{ color: "#7A5C73", fontSize: 16, margin: "0 0 16px", fontWeight: 600 }}>Pick your times tables and start the sweetest math game!</p>

      {progress.roundsPlayed > 0 && (
        <div style={{ display: "flex", justifyContent: "center", gap: 20, marginBottom: 18, fontWeight: 800 }}>
          <div style={{ display: "flex", alignItems: "center", gap: 5, color: "#FFC93C" }}>
            <StarIcon size={16} fill="#FFC93C" stroke="#E0A415" />
            <span className="display-font" style={{ color: "#3D2645", fontSize: 14 }}>{progress.totalStars} stars</span>
          </div>
          <div style={{ display: "flex", alignItems: "center", gap: 5, color: "#8B5FBF" }}>
            <TrophyIcon size={16} />
            <span className="display-font" style={{ color: "#3D2645", fontSize: 14 }}>{progress.roundsPlayed} rounds</span>
          </div>
        </div>
      )}

      <div style={{ background: "#ffffff", borderRadius: 24, padding: "20px 18px", boxShadow: "0 6px 0 #F0DCC7, 0 8px 20px rgba(200,150,100,0.15)", marginBottom: 18 }}>
        <p className="display-font" style={{ fontSize: 15, fontWeight: 700, color: "#8B5FBF", margin: "0 0 12px" }}>Choose your tables</p>
        <div style={{ display: "grid", gridTemplateColumns: "repeat(4, 1fr)", gap: 10 }}>
          {TABLES.map((n) => {
            const active = selectedTables.includes(n);
            const c = pickCandyColor(n);
            const level = masteryLevel(progress.tables[String(n)]);
            return (
              <button key={n} onClick={() => toggleTable(n)} className="table-chip display-font" style={{
                border: "none", borderRadius: 14, padding: "12px 0", fontSize: 20, fontWeight: 700, cursor: "pointer",
                background: active ? c.fill : "#F5EFE6", color: active ? "#ffffff" : "#B7A99A",
                boxShadow: active ? `0 3px 0 ${c.dark}` : "0 3px 0 #E4DACB",
              }}>
                {n}
                {level === "mastered" && (
                  <AwardIcon size={14} style={{ position: "absolute", top: 3, right: 3, color: active ? "#fff" : "#E0A415" }} fill={active ? "#fff" : "#FFC93C"} />
                )}
              </button>
            );
          })}
        </div>
      </div>

      <button onClick={toggleSpeedMode} className="display-font" style={{
        border: "none", borderRadius: 18, padding: "12px 18px", fontSize: 14, fontWeight: 700, cursor: "pointer",
        background: speedMode ? "#FFE7C2" : "#ffffff", color: speedMode ? "#B8720B" : "#B7A99A",
        boxShadow: "0 3px 0 #E4DACB", marginBottom: 20, display: "inline-flex", alignItems: "center", gap: 8,
      }}>
        <ZapIcon size={16} fill={speedMode ? "#B8720B" : "none"} />
        Speed mode {speedMode ? "on" : "off"}
      </button>

      <div>
        <button onClick={onStart} className="display-font choice-btn" style={{
          border: "none", borderRadius: 20, padding: "16px 40px", fontSize: 22, fontWeight: 800, color: "#ffffff",
          cursor: "pointer", background: "#FF6B9D", boxShadow: "0 5px 0 #C4467A",
          display: "inline-flex", alignItems: "center", gap: 8,
        }}>
          Start playing <ChevronRightIcon size={22} />
        </button>
      </div>
      <p style={{ marginTop: 14, color: "#B7A99A", fontSize: 13, fontWeight: 600 }}>
        {selectedTables.length === 0
          ? "No tables picked yet — we'll use 2, 3, 4 and 5."
          : `${ROUND_LENGTH} questions from the ${selectedTables.join(", ")} times table${selectedTables.length > 1 ? "s" : ""}.`}
      </p>

      {progress.roundsPlayed > 0 && (
        <button onClick={onResetTap} style={{ marginTop: 18, border: "none", background: "none", color: resetArmed ? "#FF6B9D" : "#D8CDBE", fontSize: 12, fontWeight: 700, cursor: "pointer" }}>
          {resetArmed ? "Tap again to erase all progress" : "Reset progress"}
        </button>
      )}
    </div>
  );
}

function PlayScreen({ qIndex, total, question, choices, selected, feedback, color, popped, streak, correctCount, mascotMood, speedMode, onAnswer, onQuit }) {
  const feedbackText = feedback === "correct" ? "Sweet! That's right! \u2728"
    : feedback === "timeout" ? `Time's up! It's ${question.answer}.`
    : feedback ? `Almost! It's ${question.answer}.` : null;

  return (
    <div>
      <div style={{ display: "flex", alignItems: "center", gap: 10, marginBottom: 18 }}>
        <button onClick={onQuit} aria-label="Back to home" className="icon-btn" style={{ color: "#8B5FBF" }}>
          <HomeIcon size={18} />
        </button>
        <div style={{ flex: 1, height: 14, background: "#EFE5D6", borderRadius: 20, overflow: "hidden" }}>
          <div style={{ height: "100%", width: `${(qIndex / total) * 100}%`, background: "linear-gradient(90deg, #FF6B9D, #FFC93C)", borderRadius: 20, transition: "width 0.4s ease" }} />
        </div>
        <span className="display-font" style={{ fontSize: 15, fontWeight: 700, color: "#7A5C73", flexShrink: 0 }}>{qIndex + 1}/{total}</span>
        {speedMode && selected === null && <TimerRing timeLimitMs={TIME_LIMIT_MS} questionKey={question.key} />}
      </div>

      <div style={{ display: "flex", justifyContent: "space-between", alignItems: "center", marginBottom: 14 }}>
        <div style={{ display: "flex", alignItems: "center", gap: 6, color: "#FF6B9D", fontWeight: 800 }}>
          <StarIcon size={18} fill="#FFC93C" stroke="#E0A415" />
          <span className="display-font">{correctCount}</span>
        </div>
        <Mascot mood={mascotMood} size={56} />
        <div style={{ display: "flex", alignItems: "center", gap: 6, color: "#8B5FBF", fontWeight: 800 }}>
          <SparklesIcon size={18} />
          <span className="display-font">{streak} streak</span>
        </div>
      </div>

      <div className={feedback === "wrong" || feedback === "timeout" ? "shake" : ""} style={{
        background: "#ffffff", borderRadius: 24, padding: "22px 18px 26px",
        boxShadow: "0 6px 0 #F0DCC7, 0 8px 20px rgba(200,150,100,0.15)", textAlign: "center", marginBottom: 18,
      }}>
        <p className="display-font" style={{ fontSize: 40, fontWeight: 800, color: "#3D2645", margin: "0 0 14px" }}>
          {question.a} &times; {question.b} = ?
        </p>
        <div style={{ minHeight: 90, display: "flex", alignItems: "center", justifyContent: "center" }}>
          <CandyGrid a={question.a} b={question.b} color={color} popped={popped} />
        </div>
      </div>

      {feedbackText && (
        <p className="display-font pop-in" style={{ textAlign: "center", fontSize: 20, fontWeight: 800, color: feedback === "correct" ? "#4ECDC4" : "#FF6B9D", margin: "0 0 12px" }}>
          {feedbackText}
        </p>
      )}

      <div style={{ display: "grid", gridTemplateColumns: "1fr 1fr", gap: 12 }}>
        {choices.map((val) => {
          const isSelected = selected === val;
          const isCorrectChoice = val === question.answer;
          let bg = "#ffffff", shadow = "0 4px 0 #E4DACB", textColor = "#3D2645";
          if (selected !== null) {
            if (isCorrectChoice) { bg = "#DFF6F3"; shadow = "0 4px 0 #4ECDC4"; textColor = "#1F8A80"; }
            else if (isSelected) { bg = "#FFE3EC"; shadow = "0 4px 0 #FF6B9D"; textColor = "#C4467A"; }
            else { bg = "#F7F2E9"; textColor = "#C9BCAC"; shadow = "0 4px 0 #E4DACB"; }
          }
          return (
            <button key={val} disabled={selected !== null} onClick={() => onAnswer(val)} className="choice-btn display-font" style={{
              border: "none", borderRadius: 16, padding: "18px 0", fontSize: 26, fontWeight: 800,
              cursor: selected !== null ? "default" : "pointer", background: bg, color: textColor, boxShadow: shadow,
            }}>
              {val}
            </button>
          );
        })}
      </div>
    </div>
  );
}

function ResultsScreen({ correctCount, total, bestStreak, fastCount, speedMode, onReplay, onHome }) {
  const { stars, msg } = ratingForAccuracy(correctCount, total);
  return (
    <div className="pop-in" style={{ textAlign: "center" }}>
      <div style={{ display: "flex", justifyContent: "center", marginBottom: 6 }}>
        <Mascot mood={stars >= 2 ? "excited" : stars === 1 ? "happy" : "sad"} size={90} />
      </div>
      <h2 className="display-font" style={{ fontSize: 28, fontWeight: 800, color: "#3D2645", margin: "6px 0 2px" }}>Round complete!</h2>
      <p style={{ color: "#7A5C73", fontSize: 15, fontWeight: 600, margin: "0 0 18px" }}>{msg}</p>

      <div style={{ background: "#ffffff", borderRadius: 24, padding: "24px 18px", boxShadow: "0 6px 0 #F0DCC7, 0 8px 20px rgba(200,150,100,0.15)", marginBottom: 22 }}>
        <div style={{ display: "flex", justifyContent: "center", gap: 6, marginBottom: 16 }}>
          {[0, 1, 2].map((i) => (
            <StarIcon key={i} size={40} fill={i < stars ? "#FFC93C" : "#EFE5D6"} stroke={i < stars ? "#E0A415" : "#E4DACB"} />
          ))}
        </div>
        <div style={{ display: "flex", justifyContent: "space-around" }}>
          <div>
            <p className="display-font" style={{ fontSize: 30, fontWeight: 800, color: "#FF6B9D", margin: 0 }}>{correctCount}/{total}</p>
            <p style={{ fontSize: 13, color: "#B7A99A", fontWeight: 700, margin: 0 }}>correct</p>
          </div>
          <div>
            <p className="display-font" style={{ fontSize: 30, fontWeight: 800, color: "#8B5FBF", margin: 0, display: "flex", alignItems: "center", gap: 4, justifyContent: "center" }}>
              <TrophyIcon size={22} /> {bestStreak}
            </p>
            <p style={{ fontSize: 13, color: "#B7A99A", fontWeight: 700, margin: 0 }}>best streak</p>
          </div>
        </div>
        {speedMode && fastCount > 0 && (
          <p className="display-font" style={{ marginTop: 14, fontSize: 13, fontWeight: 700, color: "#B8720B", display: "flex", alignItems: "center", justifyContent: "center", gap: 6 }}>
            <ZapIcon size={14} fill="#B8720B" /> {fastCount} lightning-fast answer{fastCount > 1 ? "s" : ""}!
          </p>
        )}
      </div>

      <div style={{ display: "flex", gap: 12, justifyContent: "center" }}>
        <button onClick={onHome} className="display-font choice-btn" style={{
          border: "none", borderRadius: 18, padding: "14px 22px", fontSize: 17, fontWeight: 800, color: "#8B5FBF",
          cursor: "pointer", background: "#F1E9FB", boxShadow: "0 4px 0 #D9C7F0", display: "inline-flex", alignItems: "center", gap: 6,
        }}>
          <HomeIcon size={18} /> Tables
        </button>
        <button onClick={onReplay} className="display-font choice-btn" style={{
          border: "none", borderRadius: 18, padding: "14px 26px", fontSize: 17, fontWeight: 800, color: "#ffffff",
          cursor: "pointer", background: "#FF6B9D", boxShadow: "0 4px 0 #C4467A", display: "inline-flex", alignItems: "center", gap: 6,
        }}>
          <RotateCcwIcon size={18} /> Play again
        </button>
      </div>
    </div>
  );
}

const root = ReactDOM.createRoot(document.getElementById("root"));
root.render(<App />);
</script>
</body>
</html>
